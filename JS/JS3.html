<!DOCTYPE html>
<html>
    <body>
        <h3> JavaScript Statements </h3>
        <p> JavaScript Statements separated by semi colon </p>
        <button type="button" onclick="myfunction()"> Click Me! </button>
        <p id="demo"></p>
        <p id="demo1"> </p>
        <script>
            function myfunction()
            {
                document.getElementById("demo").innerHTML = "Hello Sai";
                document.getElementById("demo1").innerHTML = "how are you";
            }
        </script>
        </body>
        </html>
