<!DOCTYPE html>
<html>
    <body>
        <h1> This is const keyword learning </h1>
        <p id = "demo"></p>
        <p id = "demo1"></p>
        <script>
            const cars = ["Saab", "BMW", "Volvo"];
            cars[0]="Maruthi";
            cars[1]="Sandra";
            cars.push("Audi");
            document.getElementById("demo").innerHTML = cars;

            const animals = {Name: "lion", height: "32INCH", color: "Brown"};
            animals.Name = "Lion";
            document.getElementById("demo1").innerHTML = JSON.stringify(animals);
            </script>
            </body>
            </html>
