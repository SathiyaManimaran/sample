<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Task Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            margin: 0 auto;
            padding: 30px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .subtitle {
            text-align: center;
            color: #999;
            margin-bottom: 25px;
            font-size: 14px;
        }
        
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        label {
            font-weight: 600;
            color: #555;
            font-size: 13px;
        }
        
        input[type="text"], input[type="date"], select {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus, input[type="date"]:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            grid-column: 1 / -1;
        }
        
        button {
            flex: 1;
            padding: 12px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 14px;
        }
        
        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .filter-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .filter-btn {
            padding: 8px 16px;
            background: #f0f0f0;
            color: #333;
            border: 2px solid transparent;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }
        
        .filter-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        
        .filter-btn:hover {
            border-color: #667eea;
        }
        
        .task-list {
            list-style: none;
        }
        
        .task-item {
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 15px;
            align-items: center;
            padding: 15px;
            background: #f9f9f9;
            border-left: 4px solid #667eea;
            margin-bottom: 12px;
            border-radius: 6px;
            transition: all 0.3s;
        }
        
        .task-item:hover {
            background: #f0f0f0;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }
        
        .task-item.completed {
            opacity: 0.6;
            border-left-color: #4caf50;
        }
        
        .task-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        
        .task-content {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .task-text {
            color: #333;
            font-weight: 500;
        }
        
        .task-item.completed .task-text {
            text-decoration: line-through;
            color: #999;
        }
        
        .task-meta {
            display: flex;
            gap: 12px;
            font-size: 12px;
            color: #999;
            flex-wrap: wrap;
        }
        
        .task-priority {
            padding: 2px 8px;
            border-radius: 3px;
            font-weight: 600;
            font-size: 11px;
        }
        
        .priority-high {
            background: #ffebee;
            color: #c62828;
        }
        
        .priority-medium {
            background: #fff3e0;
            color: #e65100;
        }
        
        .priority-low {
            background: #e8f5e9;
            color: #2e7d32;
        }
        
        .task-category {
            background: #e3f2fd;
            color: #1565c0;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 11px;
        }
        
        .task-date {
            background: #f3e5f5;
            color: #6a1b9a;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 11px;
        }
        
        .task-buttons {
            display: flex;
            gap: 6px;
        }
        
        .btn-action {
            padding: 6px 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
            font-weight: 600;
        }
        
        .btn-edit {
            background: #2196F3;
            color: white;
        }
        
        .btn-edit:hover {
            background: #1976D2;
        }
        
        .btn-delete {
            background: #f44336;
            color: white;
        }
        
        .btn-delete:hover {
            background: #da190b;
        }
        
        .btn-copy {
            background: #FF9800;
            color: white;
        }
        
        .btn-copy:hover {
            background: #E65100;
        }
        
        .empty-state {
            text-align: center;
            color: #999;
            padding: 50px 20px;
            font-size: 16px;
        }
        
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }
        
        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        .modal-header {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
        }
        
        .modal-body {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        
        .btn-primary {
            background: #667eea;
        }
        
        .btn-secondary {
            background: #999;
        }
        
        .btn-primary:hover {
            background: #5568d3;
        }
        
        .btn-secondary:hover {
            background: #777;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 28px;
            font-weight: bold;
        }
        
        .stat-label {
            font-size: 12px;
            opacity: 0.9;
            margin-top: 5px;
        }
        
        .sync-status {
            text-align: center;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 6px;
            font-size: 13px;
            display: none;
        }
        
        .sync-status.show {
            display: block;
        }
        
        .sync-success {
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #4caf50;
        }
        
        .sync-error {
            background: #ffebee;
            color: #c62828;
            border: 1px solid #f44336;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 Advanced Task Manager</h1>
        <p class="subtitle">Manage your tasks efficiently with priority, due dates, and categories</p>
        
        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalTasks">0</div>
                <div class="stat-label">Total Tasks</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="completedTasks">0</div>
                <div class="stat-label">Completed</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="pendingTasks">0</div>
                <div class="stat-label">Pending</div>
            </div>
        </div>
        
        <div id="syncStatus" class="sync-status"></div>
        
        <div class="controls">
            <div class="input-group">
                <label for="taskInput">Task Description</label>
                <input 
                    type="text" 
                    id="taskInput" 
                    placeholder="Enter task..." 
                    onkeypress="handleKeyPress(event)"
                >
            </div>
            
            <div class="input-group">
                <label for="prioritySelect">Priority</label>
                <select id="prioritySelect">
                    <option value="low">Low</option>
                    <option value="medium" selected>Medium</option>
                    <option value="high">High</option>
                </select>
            </div>
            
            <div class="input-group">
                <label for="categorySelect">Category</label>
                <select id="categorySelect">
                    <option value="">Select Category</option>
                    <option value="Work">Work</option>
                    <option value="Personal">Personal</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Health">Health</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            
            <div class="input-group">
                <label for="dueDate">Due Date</label>
                <input type="date" id="dueDate">
            </div>
            
            <div class="button-group">
                <button onclick="addTask()" style="background: #4caf50;">➕ Add Task</button>
                <button onclick="syncToDB()" style="background: #2196F3;">☁️ Sync to DB</button>
                <button onclick="exportData()" style="background: #FF9800;">⬇️ Export</button>
            </div>
        </div>
        
        <div class="filter-group">
            <button class="filter-btn active" onclick="filterTasks('all')">All</button>
            <button class="filter-btn" onclick="filterTasks('pending')">Pending</button>
            <button class="filter-btn" onclick="filterTasks('completed')">Completed</button>
            <button class="filter-btn" onclick="filterTasks('high')">High Priority</button>
            <button class="filter-btn" onclick="clearAllCompleted()" style="background: #f44336; color: white; margin-left: auto;">🗑️ Clear Completed</button>
        </div>
        
        <ul class="task-list" id="taskList">
            <li class="empty-state">No tasks yet. Add one to get started!</li>
        </ul>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">Edit Task</div>
            <div class="modal-body">
                <div class="input-group">
                    <label for="editTaskText">Task Description</label>
                    <input type="text" id="editTaskText">
                </div>
                <div class="input-group">
                    <label for="editPriority">Priority</label>
                    <select id="editPriority">
                        <option value="low">Low</option>
                        <option value="medium">Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="editCategory">Category</label>
                    <select id="editCategory">
                        <option value="">Select Category</option>
                        <option value="Work">Work</option>
                        <option value="Personal">Personal</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Health">Health</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="editDueDate">Due Date</label>
                    <input type="date" id="editDueDate">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-action btn-secondary" onclick="closeEditModal()">Cancel</button>
                <button class="btn-action btn-primary" onclick="saveEditedTask()">Save</button>
            </div>
        </div>
    </div>

    <script>
        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
        let editingIndex = -1;
        let currentFilter = 'all';
        const API_URL = 'http://localhost:3000/api/tasks'; // Your backend API URL
        let useBackend = true; // Set to false to use localStorage only

        function addTask() {
            const input = document.getElementById('taskInput');
            const priority = document.getElementById('prioritySelect').value;
            const category = document.getElementById('categorySelect').value;
            const dueDate = document.getElementById('dueDate').value;
            const text = input.value.trim();
            
            if (text === '') {
                alert('Please enter a task!');
                return;
            }
            
            const newTask = {
                id: Date.now(),
                text: text,
                priority: priority,
                category: category,
                dueDate: dueDate,
                completed: false,
                createdAt: new Date().toISOString()
            };
            
            tasks.push(newTask);
            input.value = '';
            document.getElementById('prioritySelect').value = 'medium';
            document.getElementById('categorySelect').value = '';
            document.getElementById('dueDate').value = '';
            
            saveTasks();
            renderTasks();
        }

        function deleteTask(index) {
            if (confirm('Are you sure you want to delete this task?')) {
                tasks.splice(index, 1);
                saveTasks();
                renderTasks();
            }
        }

        function toggleTask(index) {
            tasks[index].completed = !tasks[index].completed;
            saveTasks();
            renderTasks();
        }

        function openEditModal(index) {
            editingIndex = index;
            const task = tasks[index];
            document.getElementById('editTaskText').value = task.text;
            document.getElementById('editPriority').value = task.priority || 'medium';
            document.getElementById('editCategory').value = task.category || '';
            document.getElementById('editDueDate').value = task.dueDate || '';
            document.getElementById('editModal').classList.add('show');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('show');
            editingIndex = -1;
        }

        function saveEditedTask() {
            if (editingIndex === -1) return;
            
            const text = document.getElementById('editTaskText').value.trim();
            if (text === '') {
                alert('Task description cannot be empty!');
                return;
            }
            
            tasks[editingIndex].text = text;
            tasks[editingIndex].priority = document.getElementById('editPriority').value;
            tasks[editingIndex].category = document.getElementById('editCategory').value;
            tasks[editingIndex].dueDate = document.getElementById('editDueDate').value;
            tasks[editingIndex].updatedAt = new Date().toISOString();
            
            saveTasks();
            renderTasks();
            closeEditModal();
        }

        function copyTask(index) {
            const task = tasks[index];
            document.getElementById('taskInput').value = task.text;
            document.getElementById('prioritySelect').value = task.priority || 'medium';
            document.getElementById('categorySelect').value = task.category || '';
            document.getElementById('dueDate').value = task.dueDate || '';
        }

        function filterTasks(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            renderTasks();
        }

        function clearAllCompleted() {
            if (confirm('Delete all completed tasks?')) {
                tasks = tasks.filter(t => !t.completed);
                saveTasks();
                renderTasks();
            }
        }

        function getFilteredTasks() {
            return tasks.filter(task => {
                switch(currentFilter) {
                    case 'pending': return !task.completed;
                    case 'completed': return task.completed;
                    case 'high': return task.priority === 'high';
                    default: return true;
                }
            });
        }

        function renderTasks() {
            const taskList = document.getElementById('taskList');
            const filteredTasks = getFilteredTasks();
            
            // Update stats
            const completed = tasks.filter(t => t.completed).length;
            document.getElementById('totalTasks').textContent = tasks.length;
            document.getElementById('completedTasks').textContent = completed;
            document.getElementById('pendingTasks').textContent = tasks.length - completed;
            
            if (filteredTasks.length === 0) {
                taskList.innerHTML = '<li class="empty-state">No tasks found</li>';
                return;
            }
            
            taskList.innerHTML = filteredTasks.map((task, idx) => {
                const realIndex = tasks.indexOf(task);
                const dueDateStr = task.dueDate ? new Date(task.dueDate).toLocaleDateString() : '';
                return `
                    <li class="task-item ${task.completed ? 'completed' : ''}">
                        <input 
                            type="checkbox" 
                            class="task-checkbox" 
                            ${task.completed ? 'checked' : ''} 
                            onchange="toggleTask(${realIndex})"
                        >
                        <div class="task-content">
                            <span class="task-text">${escapeHtml(task.text)}</span>
                            <div class="task-meta">
                                <span class="task-priority priority-${task.priority || 'low'}">
                                    ${(task.priority || 'low').toUpperCase()}
                                </span>
                                ${task.category ? `<span class="task-category">${escapeHtml(task.category)}</span>` : ''}
                                ${task.dueDate ? `<span class="task-date">📅 ${dueDateStr}</span>` : ''}
                            </div>
                        </div>
                        <div class="task-buttons">
                            <button class="btn-action btn-edit" onclick="openEditModal(${realIndex})">✏️ Edit</button>
                            <button class="btn-action btn-copy" onclick="copyTask(${realIndex})">📋 Copy</button>
                            <button class="btn-action btn-delete" onclick="deleteTask(${realIndex})">🗑️ Delete</button>
                        </div>
                    </li>
                `;
            }).join('');
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        function saveTasks() {
            localStorage.setItem('tasks', JSON.stringify(tasks));
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                addTask();
            }
        }

        // Sync to Database
        async function syncToDB() {
            const syncStatus = document.getElementById('syncStatus');
            syncStatus.className = 'sync-status show';
            syncStatus.textContent = '⏳ Syncing to database...';

            if (!useBackend) {
                syncStatus.className = 'sync-status show sync-error';
                syncStatus.textContent = '❌ Backend is not enabled. Set useBackend = true';
                return;
            }

            try {
                const response = await fetch(`${API_URL}/sync`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ tasks: tasks })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                
                if (data.success) {
                    syncStatus.className = 'sync-status show sync-success';
                    syncStatus.textContent = `✅ Successfully synced ${data.count} tasks to database!`;
                    setTimeout(() => {
                        syncStatus.classList.remove('show');
                    }, 3000);
                } else {
                    throw new Error(data.message);
                }
            } catch (err) {
                console.error('Sync error:', err);
                syncStatus.className = 'sync-status show sync-error';
                syncStatus.textContent = `❌ Sync failed: ${err.message}. Make sure the backend is running on port 3000.`;
            }
        }

        // Add task to backend
        async function addTaskToBackend(taskData) {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(taskData)
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                if (data.success) {
                    return data.data;
                } else {
                    throw new Error(data.message);
                }
            } catch (err) {
                console.warn('Backend not available, using localStorage:', err.message);
                return null;
            }
        }

        // Delete task from backend
        async function deleteTaskFromBackend(taskId) {
            try {
                const response = await fetch(`${API_URL}/${taskId}`, {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                return data.success;
            } catch (err) {
                console.warn('Backend delete failed, using localStorage:', err.message);
                return true;
            }
        }

        // Update task in backend
        async function updateTaskInBackend(taskId, updates) {
            try {
                const response = await fetch(`${API_URL}/${taskId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(updates)
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                return data.success;
            } catch (err) {
                console.warn('Backend update failed, using localStorage:', err.message);
                return true;
            }
        }

        // Export Data
        function exportData() {
            const dataStr = JSON.stringify(tasks, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `tasks-${new Date().toISOString().split('T')[0]}.json`;
            link.click();
        }

        // Close modal when clicking outside
        document.getElementById('editModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeEditModal();
            }
        });

        renderTasks();
    </script>
</body>
</html>
